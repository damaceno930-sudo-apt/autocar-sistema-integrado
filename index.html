<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081321" />
    <meta name="description" content="AutoCar Sistema Integrado — protótipo local de gestão para oficinas mecânicas." />
    <title>AutoCar Sistema Integrado</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" role="img"><path d="M8.5 26.4 12 15.8c.7-2.2 2.8-3.7 5.1-3.7h9.8c2.4 0 4.4 1.5 5.2 3.7l3.4 10.6"/><path d="M7.4 25.6h29.2v8.5a2.4 2.4 0 0 1-2.4 2.4H9.8a2.4 2.4 0 0 1-2.4-2.4v-8.5Z"/><path d="M12 20h20M12 31h.1M31.9 31h.1"/></svg>
          </div>
          <div>
            <div class="brand-name">Auto<span>Car</span></div>
            <div class="brand-subtitle">SISTEMA INTEGRADO</div>
          </div>
        </div>

        <div class="shop-selector">
          <span class="shop-avatar">AS</span>
          <div class="shop-copy"><strong>Auto Service Prime</strong><span>Unidade principal</span></div>
          <span class="chevron">⌄</span>
        </div>

        <nav class="sidebar-nav" aria-label="Navegação principal">
          <div class="nav-caption">Operação</div>
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="dashboard"></span><span>Dashboard</span><span class="nav-badge">4</span></button>
          <button class="nav-item" data-view="orders"><span class="nav-icon" data-icon="clipboard"></span><span>Ordens de serviço</span></button>
          <button class="nav-item" data-view="customers"><span class="nav-icon" data-icon="users"></span><span>Clientes e veículos</span></button>
          <button class="nav-item" data-view="inventory"><span class="nav-icon" data-icon="box"></span><span>Estoque e peças</span><span class="nav-dot"></span></button>
          <button class="nav-item" data-view="services"><span class="nav-icon" data-icon="wrench"></span><span>Serviços e preços</span></button>
          <button class="nav-item" data-view="schedule"><span class="nav-icon" data-icon="calendar"></span><span>Agendamentos</span></button>

          <div class="nav-caption nav-caption-spaced">Gestão</div>
          <button class="nav-item" data-view="diagnostics"><span class="nav-icon" data-icon="scan"></span><span>Diagnóstico</span></button>
          <button class="nav-item" data-view="finance"><span class="nav-icon" data-icon="wallet"></span><span>Financeiro</span></button>
          <button class="nav-item" data-view="fleet"><span class="nav-icon" data-icon="car"></span><span>Frota</span></button>
          <button class="nav-item" data-view="reports"><span class="nav-icon" data-icon="chart"></span><span>Relatórios</span></button>

          <div class="nav-caption nav-caption-spaced">Sistema</div>
          <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="settings"></span><span>Configurações</span></button>
          <button class="nav-item" data-view="backup"><span class="nav-icon" data-icon="database"></span><span>Backup local</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="offline-status"><span class="status-pulse"></span><div><strong>Modo offline</strong><small>Dados armazenados neste computador</small></div></div>
          <div class="sidebar-version">AutoCar v0.1.0 • Protótipo</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span id="breadcrumb-section">Visão geral</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
          <div class="topbar-actions">
            <label class="search-box" aria-label="Buscar no sistema"><span class="search-icon" data-icon="search"></span><input id="global-search" type="search" placeholder="Buscar cliente, placa ou OS..." autocomplete="off" /></label>
            <button class="icon-button" title="Central de avisos" aria-label="Central de avisos"><span data-icon="bell"></span><i></i></button>
            <div class="user-profile"><span class="user-avatar">RC</span><div><strong>Rafael Costa</strong><small>Administrador</small></div><span class="chevron">⌄</span></div>
          </div>
        </header>

        <section class="page-content" id="view" aria-live="polite"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header"><div><span class="eyebrow">Operação</span><h2 id="modal-title">Nova ordem de serviço</h2></div><button class="modal-close" data-close-modal aria-label="Fechar">×</button></div>
        <form id="new-order-form">
          <div class="form-grid">
            <label class="field field-span-2"><span>Cliente</span><input name="customer" required placeholder="Nome completo" /></label>
            <label class="field"><span>Placa</span><input name="plate" required placeholder="ABC-1D23" maxlength="8" /></label>
            <label class="field"><span>Veículo</span><input name="vehicle" required placeholder="Modelo e ano" /></label>
            <label class="field"><span>Serviço principal</span><select name="service"><option>Revisão preventiva</option><option>Troca de óleo</option><option>Freios e suspensão</option><option>Diagnóstico eletrônico</option></select></label>
            <label class="field"><span>Previsão de entrega</span><input type="date" name="delivery" required /></label>
            <label class="field field-span-2"><span>Observação inicial</span><textarea name="notes" rows="3" placeholder="Relato do cliente ou observações da recepção"></textarea></label>
          </div>
          <div class="modal-footer"><button type="button" class="button button-ghost" data-close-modal>Cancelar</button><button type="submit" class="button button-primary"><span data-icon="plus"></span> Criar ordem</button></div>
        </form>
      </section>
    </div>
    <div class="toast-region" id="toast-region" aria-live="assertive"></div>
    <script src="app.js"></script>
  </body>
</html>
